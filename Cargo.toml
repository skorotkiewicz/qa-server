[package]
name    = "qa-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qa-server"
path = "src/bin/server.rs"

[[bin]]
name = "qa"
path = "src/bin/client.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
axum       = { version = "0.8.9", features = ["json"] }
serde      = { version = "1", features = ["derive"] }
sqlx       = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "macros", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde_yaml = "0.9"
clap       = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest    = { version = "0.13.3", features = ["json", "blocking"] }
anyhow     = "1"
dirs       = "6"
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
rand       = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
