[package]
name    = "qa-rs"
version = "0.1.0"
edition = "2024"
description = "High-performance Q&A system with HTTP API and CLI"
authors = ["Sebastian Korotkiewicz <skorotkiewicz@gmail.com>"]
license = "MIT"
repository = "https://github.com/skorotkiewicz/qa-server"
homepage = "https://github.com/skorotkiewicz/qa-server"
documentation = "https://github.com/skorotkiewicz/qa-server#readme"
keywords = ["qa", "questions", "answers", "api", "cli", "rust"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[[bin]]
name = "qa-server"
path = "src/bin/server.rs"

[[bin]]
name = "qa"
path = "src/bin/client.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full"] }
tower_governor = { version = "0.8", features = ["axum"] }
axum       = { version = "0.8.9", features = ["json"] }
serde      = { version = "1", features = ["derive"] }
sqlx       = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "macros", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde_yaml = "0.9"
clap       = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest    = { version = "0.13.3", features = ["json", "blocking"] }
anyhow     = "1"
dirs       = "6"
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
rand       = "0.8"
redis      = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
